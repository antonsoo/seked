name: Pages

# Builds the site and publishes it to the gh-pages branch; GitHub Pages serves that
# branch directly (Settings -> Pages -> "Deploy from a branch": gh-pages, /).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Publish to gh-pages
        run: |
          git fetch origin gh-pages
          publish_dir="$RUNNER_TEMP/seked-pages"
          git worktree add --detach "$publish_dir" origin/gh-pages
          cp -R dist/. "$publish_dir/"
          touch "$publish_dir/.nojekyll"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add -A
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "deploy: ${GITHUB_SHA::7}"
            git -C "$publish_dir" push origin HEAD:gh-pages
          fi
          # Preserve older hashed assets for readers with a cached entry page.
